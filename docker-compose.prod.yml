# ─────────────────────────────────────────────────────────────
#  PRODUCTION Docker mode
#  • Gunicorn serves Django (no runserver)
#  • Nginx reverse proxy on host port 8082 → Django
#  • Static/media served via Nginx
#  • restart: always on every service
#
#  Usage:  sudo bash run.sh docker-prod
# ─────────────────────────────────────────────────────────────
include:
  - docker-compose.base.yml

services:
  web:
    build: .
    container_name: townmarket_web_prod
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - townmarket_static_volume:/app/staticfiles
      - townmarket_media_volume:/app/media
    expose:
      - "8000"                              # internal only — Nginx proxies
    env_file:
      - .env
    environment:
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - townmarket_net
    restart: always

  nginx:
    image: nginx:alpine
    container_name: townmarket_nginx
    ports:
      - "8082:8080"                         # host:8082 → Nginx:8080 → Django:8000
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - townmarket_static_volume:/app/staticfiles
      - townmarket_media_volume:/app/media
    depends_on:
      - web
    networks:
      - townmarket_net
    restart: always
