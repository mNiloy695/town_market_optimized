# HTTP server block - proxy to Django app
upstream django {
    server web:8000;  # Docker Compose service name on the internal network
    keepalive 32;
}

# Main server block
server {
    listen 8080;
    server_name localhost;

    # Serve static files from collectstatic
    location /static/ {
        alias /app/staticfiles/;  # Mounted volume from Docker Compose
    }

    # Media files - served from Cloudflare R2, but we can proxy or pass through
    location /media/ {
        # Since files are on R2, we can either:
        # 1. Proxy to R2 (not typical - R2 has its own CDN)
        # 2. Serve from local volume if files exist
        # 3. Pass through to Django for signed URLs
        alias /app/media/;  # Fallback to local volume
        # Or proxy_pass http://django/media/ if needed
    }

    # Proxy pass to Django application
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data:;" always;

        # Buffer settings for large file uploads
        proxy_buffering off;
        proxy_request_buffering off;
    }
}