services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8082:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: always
    depends_on:
      - web
    networks:
      - townmarket

  # Django Application
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8081:8000"
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - townmarket

  # Celery Worker
  celery_worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - townmarket

  # Celery Beat (Scheduler)
  celery_beat:
    build: .
    command: celery -A core beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - townmarket

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - townmarket
    restart: always
    env_file:
      - .env

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - townmarket
    restart: always
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  townmarket:
    driver: bridge