# ─────────────────────────────────────────────────────────────
#  DEVELOPMENT Docker mode
#  • Django runs directly on port 8000 (no Nginx)
#  • Hot-reload via volume mount
#  • Uses runserver (not gunicorn)
#
#  Usage:  sudo bash run.sh docker-dev
# ─────────────────────────────────────────────────────────────
include:
  - docker-compose.base.yml

services:
  web:
    build: .
    container_name: townmarket-web-dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app                              # live code reload
      - townmarket_static_volume:/app/staticfiles
      - townmarket_media_volume:/app/media
    ports:
      - "8000:8000"                         # direct Django, no proxy
    env_file:
      - .env
    environment:
      - DEBUG=True
      # Public URL from which SSLCommerz callbacks redirect the buyer back.
      # localhost:8000 mirrors the host-mapped port 8000 in this compose file.
      - PAYMENT_CALLBACK_BASE_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - townmarket_net
    restart: "no"                           # dev: let it crash visibly

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: townmarket_frontend_dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://townmarket-web-dev:8000/v1
      - VITE_MEDIA_BASE_URL=http://localhost:8000/media
    depends_on:
      - web
    networks:
      - townmarket_net
    restart: "no"
