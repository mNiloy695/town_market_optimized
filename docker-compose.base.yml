# ─────────────────────────────────────────────────────────────
#  Base services shared by BOTH dev and prod Docker modes.
#  Do NOT use this file directly — use docker-compose.dev.yml
#  or docker-compose.prod.yml via run.sh
#
#  All resource names are prefixed with 'townmarket_' to avoid
#  conflicts with other projects on the same Docker host.
# ─────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: townmarket_db
    volumes:
      - townmarket_postgres_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - townmarket_net
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: townmarket_redis
    ports:
      - "6380:6379"
    volumes:
      - townmarket_redis_data:/data
    networks:
      - townmarket_net
    restart: always

  # ── Celery Worker ─────────────────────────────────────────
  celery_worker:
    build: .
    container_name: townmarket_celery_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - townmarket_net

  # ── Celery Beat (Scheduler) ───────────────────────────────
  celery_beat:
    build: .
    container_name: townmarket_celery_beat
    command: celery -A core beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - redis
    networks:
      - townmarket_net

volumes:
  townmarket_postgres_data:
  townmarket_redis_data:
  townmarket_static_volume:
  townmarket_media_volume:

networks:
  townmarket_net:
    driver: bridge
    name: townmarket_net   # explicit name — prevents Compose from auto-prefixing
